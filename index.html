<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Discussion Groups Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Join Discussion Group</h1>

<div class="container">

  <!-- Registration Form -->
  <input id="name" placeholder="Your Name">
  <input id="reg" placeholder="Registration Number">

  <select id="gender">
    <option value="">Select Gender</option>
    <option value="female">Female</option>
    <option value="male">Male</option>
  </select>

  <button id="submitBtn">Submit</button>

  <p id="msg"></p>

  <hr>

  <!-- Check Group Section -->
  <h2>Check Your Group</h2>

  <input id="checkReg" placeholder="Enter Registration Number">
  <button id="checkBtn">Check</button>

  <p id="groupResult"></p>

</div>

<!-- IMPORTANT: Only this script (no other Supabase script!) -->
<script type="module" src="script.js"></script>

</body>
</html>
